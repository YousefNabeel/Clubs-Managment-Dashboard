<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>HTU Club Events</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style id="app-style">
/* Layout: an HTU-style campus portal. Utility bar, sticky header, a navy hero that holds a live "next up" ticket,
   then ticket-stub event cards on a cool paper ground. Motion borrows AI Quest's ideas: themed page transitions,
   drifting shapes, a day/night switch, an event slider and a hidden easter egg. */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#E9EDF4; --fg:#0D1A30; --muted:#56637C; --line:#D7DEE9;
  --signal:#E7363F; --signal-hover:#C92A33; --signal-soft:#FCE7E8; --signal-ink:#C42630; --on-signal:#FFFFFF; --info:#1F5FBF; --info-soft:#E3ECFB;
  --hero:#0B1730; --hero-2:#14294C; --hero-fg:#F2F5FA; --hero-muted:#A8B5CC; --hero-line:rgba(242,245,250,.07); --hero-accent:#FF5961;
  --warn:#9A5B00; --warn-soft:#FFF0D6; --ok:#0F7655; --ok-soft:#DCF2E8;
  --edge:#FFFFFF; --on-club:#FFFFFF; --scrim:rgba(5,10,20,.62);
  --shadow-1:0 1px 2px rgba(13,26,48,.06),0 12px 28px -16px rgba(13,26,48,.28);
  --shadow-2:0 2px 6px rgba(13,26,48,.08),0 30px 60px -24px rgba(13,26,48,.45);
  --shadow-sticker:2px 3px 0 rgba(13,26,48,.26);
  --font-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --font-body:"IBM Plex Sans Arabic","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-data:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-s:8px; --r-m:14px; --r-l:22px; --dx:1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08101D; --surface:#101A2C; --surface-2:#17233A; --fg:#E8EEF8; --muted:#95A3BC; --line:#233150;
  --signal:#EF3842; --signal-hover:#FF5A62; --signal-soft:#3A151A; --signal-ink:#FF6B72; --on-signal:#FFFFFF; --info:#86AEF5; --info-soft:#15233F;
  --hero:#050B17; --hero-2:#0E1C37; --hero-fg:#EEF2F9; --hero-muted:#93A1BA; --hero-line:rgba(238,242,249,.06); --hero-accent:#FF636B;
  --warn:#F0A640; --warn-soft:#352711; --ok:#42C998; --ok-soft:#0E2D23;
  --edge:#EEF2F9; --scrim:rgba(0,0,0,.7);
  --shadow-1:0 1px 2px rgba(0,0,0,.4),0 14px 30px -16px rgba(0,0,0,.7);
  --shadow-2:0 2px 6px rgba(0,0,0,.5),0 30px 60px -20px rgba(0,0,0,.8);
  --shadow-sticker:2px 3px 0 rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08101D; --surface:#101A2C; --surface-2:#17233A; --fg:#E8EEF8; --muted:#95A3BC; --line:#233150;
  --signal:#EF3842; --signal-hover:#FF5A62; --signal-soft:#3A151A; --signal-ink:#FF6B72; --on-signal:#FFFFFF; --info:#86AEF5; --info-soft:#15233F;
  --hero:#050B17; --hero-2:#0E1C37; --hero-fg:#EEF2F9; --hero-muted:#93A1BA; --hero-line:rgba(238,242,249,.06); --hero-accent:#FF636B;
  --warn:#F0A640; --warn-soft:#352711; --ok:#42C998; --ok-soft:#0E2D23;
  --edge:#EEF2F9; --scrim:rgba(0,0,0,.7);
  --shadow-1:0 1px 2px rgba(0,0,0,.4),0 14px 30px -16px rgba(0,0,0,.7);
  --shadow-2:0 2px 6px rgba(0,0,0,.5),0 30px 60px -20px rgba(0,0,0,.8);
  --shadow-sticker:2px 3px 0 rgba(0,0,0,.55); color-scheme:dark}
:root[dir="rtl"]{--dx:-1}
@property --iris{syntax:'<length>';inherits:false;initial-value:0px}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:clip}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance;font-weight:600}
p{margin:0}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px;border-radius:6px}
.ico{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
[dir="rtl"] .flip{transform:scaleX(-1)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{width:100%;max-width:1200px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--font-data);font-variant-numeric:tabular-nums}
.eyebrow{font:600 .74rem/1.2 var(--font-data);letter-spacing:.14em;text-transform:uppercase;color:var(--signal-ink)}
:lang(ar) .eyebrow{letter-spacing:0;font-family:var(--font-body);font-size:.85rem}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:46px;padding:0 1.15em;border-radius:999px;border:1.5px solid transparent;font-weight:600;font-size:.95rem;text-decoration:none;cursor:pointer;transition:background .2s,transform .2s,border-color .2s,color .2s;white-space:nowrap}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.primary{background:var(--signal);color:var(--on-signal)}
.btn.primary:hover{background:var(--signal-hover)}
.btn.ghost{border-color:currentColor;background:transparent}
.btn.ghost:hover{background:color-mix(in srgb,currentColor 10%,transparent)}
.btn.quiet{background:var(--surface-2);color:var(--fg)}
.btn.quiet:hover{background:color-mix(in srgb,var(--fg) 12%,var(--surface-2))}
.btn.danger{background:transparent;color:var(--signal-ink);border-color:color-mix(in srgb,var(--signal) 45%,transparent)}
.btn.danger:hover{background:var(--signal-soft)}
.btn.sm{min-height:36px;padding:0 .9em;font-size:.85rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn .arr{transition:transform .2s}
.btn:hover .arr{transform:translateX(calc(4px * var(--dx)))}
[dir="rtl"] .btn:hover .arr.flip{transform:scaleX(-1) translateX(4px)}
.icon-btn{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;border:0;background:var(--surface-2);color:var(--fg);cursor:pointer}
.icon-btn:hover{background:color-mix(in srgb,var(--fg) 14%,var(--surface-2))}

/* top bar + header */
/* header actions: language pill + day/night switch */
.hdr-actions{order:3;display:flex;align-items:center;gap:10px;flex:none}
.lang{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;font-size:.85rem;font-weight:500;transition:border-color .2s}
.lang:hover{border-color:var(--fg)}
.lang .ls{display:none}
.dn{position:relative;flex:none;width:62px;height:32px;padding:0;border:0;border-radius:999px;cursor:pointer;overflow:hidden;background:linear-gradient(180deg,#9AD8FF,#5FB4EE);box-shadow:inset 0 2px 5px rgba(0,0,0,.2),0 0 0 1.5px var(--line);transition:background .5s ease}
.dn[aria-checked="true"]{background:linear-gradient(180deg,#0D1835,#24386B)}
.dn-sky{position:absolute;inset:0;pointer-events:none}
.dn-cloud{position:absolute;top:15px;inset-inline-end:8px;width:20px;height:8px;border-radius:8px;background:#FFFFFF;opacity:.95;transition:transform .5s ease,opacity .35s}
.dn-cloud::before{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:inherit;top:-5px;inset-inline-start:4px}
.dn[aria-checked="true"] .dn-cloud{opacity:0;transform:translateY(12px)}
.dn-star{position:absolute;width:3px;height:3px;border-radius:50%;background:#FFFFFF;opacity:0;transition:opacity .4s .1s}
.dn-star:nth-child(2){top:8px;inset-inline-start:11px}
.dn-star:nth-child(3){top:19px;inset-inline-start:20px;width:2px;height:2px}
.dn-star:nth-child(4){top:10px;inset-inline-start:27px;width:2px;height:2px}
.dn[aria-checked="true"] .dn-star{opacity:1;animation:twinkle 2.4s ease-in-out infinite}
.dn[aria-checked="true"] .dn-star:nth-child(3){animation-delay:.8s}
.dn[aria-checked="true"] .dn-star:nth-child(4){animation-delay:1.6s}
@keyframes twinkle{50%{opacity:.25}}
.dn-knob{position:absolute;top:4px;inset-inline-start:4px;width:24px;height:24px;border-radius:50%;background:#FFC93C;box-shadow:0 0 0 4px rgba(255,201,60,.3),0 2px 5px rgba(0,0,0,.25);transition:transform .6s cubic-bezier(.55,-.25,.3,1.35),background .5s,box-shadow .5s,scale .2s}
.dn[aria-checked="true"] .dn-knob{transform:translateX(calc(30px * var(--dx))) rotate(calc(-210deg * var(--dx)));background:#E8EDF7;box-shadow:0 0 0 4px rgba(232,237,247,.1),0 2px 5px rgba(0,0,0,.45)}
.dn-knob i{position:absolute;border-radius:50%;background:#C2CBDC;opacity:0;transition:opacity .35s .15s}
.dn-knob i:nth-child(1){width:7px;height:7px;top:5px;left:5px}
.dn-knob i:nth-child(2){width:4px;height:4px;top:14px;left:13px}
.dn-knob i:nth-child(3){width:3px;height:3px;top:6px;left:15px}
.dn[aria-checked="true"] .dn-knob i{opacity:1}
.dn:hover .dn-knob{scale:1.08}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){z-index:2}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:12px 20px;min-height:74px;flex-wrap:wrap}
.brand{order:1;display:inline-flex;align-items:center;gap:12px;text-decoration:none;cursor:pointer;user-select:none}
.logo{display:block;height:34px;width:auto;flex:none;transition:transform .35s cubic-bezier(.2,.8,.2,1.4)}
.brand:hover .logo{transform:scale(1.05) rotate(calc(-3deg * var(--dx)))}
.brand-word{display:grid;line-height:1.15;padding-inline-start:12px;border-inline-start:1.5px solid var(--line)}
.brand-word b{font:600 1.08rem/1.15 var(--font-display)}
.brand-word small{color:var(--muted);font-size:.78rem}
.nav{order:2;margin-inline-start:auto;position:relative;display:flex;gap:4px;align-items:center}
.nav-a{position:relative;display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:999px;text-decoration:none;font-weight:500;font-size:.95rem;color:var(--muted);cursor:pointer;transition:color .2s}
.nav-a:hover{color:var(--fg)}
.nav-a.on{color:var(--fg)}
.nav-a.add{color:var(--signal-ink)}
.nav-a .nav-logo{width:22px;border-radius:7px}
.nav-ink{position:absolute;left:0;bottom:2px;height:3px;border-radius:3px;background:var(--signal);transition:transform .45s cubic-bezier(.6,.0,.2,1.3),width .45s cubic-bezier(.6,0,.2,1.3);pointer-events:none}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--hero);color:var(--hero-fg);isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-2;background:
  radial-gradient(60% 80% at 8% 110%,color-mix(in srgb,var(--signal) 34%,transparent),transparent 60%),
  radial-gradient(50% 60% at 95% -10%,var(--hero-2),transparent 70%),
  repeating-linear-gradient(0deg,var(--hero-line) 0 1px,transparent 1px 56px),
  repeating-linear-gradient(90deg,var(--hero-line) 0 1px,transparent 1px 56px)}
.drifts{position:absolute;inset:0;z-index:-1;pointer-events:none}
.drift{position:absolute;color:var(--hero-fg);opacity:.16;animation:drift var(--d,14s) ease-in-out infinite alternate}
.drift.red{color:var(--hero-accent);opacity:.55}
.drift svg{display:block;width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
@keyframes drift{from{transform:translate(0,0) rotate(0)}to{transform:translate(var(--tx,20px),var(--ty,-24px)) rotate(var(--rot,18deg))}}
.hero-in{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:48px;align-items:center;padding-block:72px 104px}
.hero-copy{display:grid;gap:22px;min-width:0}
.hero .eyebrow{color:var(--hero-accent)}
.hero h1{font-size:clamp(2.6rem,6vw,4.6rem);font-weight:700;line-height:1;letter-spacing:-.025em}
:lang(ar) .hero h1{letter-spacing:0;line-height:1.2}
.hero h1 em{display:block;font-style:normal;color:var(--hero-accent)}
.hero h1 em::after{content:"";display:block;height:.1em;width:3.2em;margin-top:.16em;background:currentColor;border-radius:9px;transform-origin:var(--ink-origin,left);animation:inkline 1.1s .25s cubic-bezier(.2,.8,.2,1) backwards}
[dir="rtl"] .hero h1 em::after{--ink-origin:right}
@keyframes inkline{from{transform:scaleX(.08)}}
.lede{font-size:1.12rem;color:var(--hero-muted);max-width:52ch}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.hero .btn.ghost{color:var(--hero-fg)}

/* tickets (shared) */
.ticket{--notch:var(--bg);position:relative;display:grid;grid-template-columns:92px minmax(0,1fr);background:var(--surface);color:var(--fg);border-radius:var(--r-m);box-shadow:var(--shadow-1);text-decoration:none;transition:transform .3s cubic-bezier(.2,.8,.2,1.2),box-shadow .3s;cursor:pointer;min-width:0}
.ticket::before,.ticket::after{content:"";position:absolute;inset-inline-start:83px;width:18px;height:18px;border-radius:50%;background:var(--notch);z-index:1}
.ticket::before{top:-9px}.ticket::after{bottom:-9px}
.ticket:hover{transform:translateY(-5px) rotate(calc(-.5deg * var(--dx)));box-shadow:var(--shadow-2)}
.stub{display:grid;align-content:center;justify-items:center;text-align:center;gap:3px;padding:18px 6px;border-inline-end:2px dashed var(--line);background:color-mix(in srgb,var(--c) 11%,var(--surface));border-start-start-radius:var(--r-m);border-end-start-radius:var(--r-m)}
.stub .mon{font:600 .72rem/1 var(--font-data);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
:lang(ar) .stub .mon{letter-spacing:0;font-family:var(--font-body);font-size:.78rem}
.stub .day{font:700 2.5rem/1 var(--font-display);color:var(--c)}
.stub .wd{font-size:.78rem;color:var(--muted)}
.tbody{display:grid;gap:10px;padding:18px 18px 16px;min-width:0;align-content:start}
.tags{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tbody h3{font-size:1.18rem;font-weight:600;overflow-wrap:anywhere}
.meta{display:grid;gap:4px;margin:0;padding:0;list-style:none;color:var(--muted);font-size:.9rem}
.meta li{display:flex;align-items:center;gap:7px;min-width:0}
.meta li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.when{justify-self:start;font:500 .78rem/1 var(--font-data);color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);padding:6px 9px;border-radius:999px}
:lang(ar) .when{font-family:var(--font-body)}

.sticker{display:inline-block;max-width:100%;font:600 .78rem/1.1 var(--font-body);color:var(--on-club);background:var(--c);padding:.42em .78em;border-radius:999px;border:2px solid var(--edge);box-shadow:0 0 0 1px color-mix(in srgb,var(--fg) 16%,transparent),var(--shadow-sticker);transform:rotate(calc(-1.6deg * var(--dx)));overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 .72rem/1 var(--font-data);letter-spacing:.06em;text-transform:uppercase;padding:6px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
:lang(ar) .chip{letter-spacing:0;text-transform:none;font-family:var(--font-body);font-size:.78rem}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.live{background:var(--signal-soft);color:var(--signal-ink)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.sample{background:transparent;border:1.5px dashed var(--muted);color:var(--muted)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.live .dot{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}

/* hero next-up ticket */
.nextup{--notch:var(--hero);position:relative;background:var(--surface);color:var(--fg);border-radius:var(--r-l);box-shadow:0 30px 70px -30px rgba(0,0,0,.6);transform:rotate(calc(1.4deg * var(--dx)));transition:transform .4s cubic-bezier(.2,.8,.2,1.2);min-width:0}
.nextup:hover{transform:rotate(0) translateY(-4px)}
.nu-top{display:grid;gap:12px;padding:24px 24px 20px}
.nu-label{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nextup h2{font-size:1.5rem;overflow-wrap:anywhere}
.nu-perf{position:relative;height:0;border-top:2px dashed var(--line);margin-inline:22px}
.nu-perf::before,.nu-perf::after{content:"";position:absolute;top:-10px;width:20px;height:20px;border-radius:50%;background:var(--notch)}
.nu-perf::before{inset-inline-start:-32px}.nu-perf::after{inset-inline-end:-32px}
.nu-bottom{display:grid;gap:14px;padding:20px 24px 24px}
.cd{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cd-c{display:grid;justify-items:center;gap:4px;padding:12px 4px 10px;border-radius:12px;background:var(--surface-2)}
.cd-c b{font:600 clamp(1.5rem,3vw,2rem)/1 var(--font-data);font-variant-numeric:tabular-nums}
.cd-c b.tick{animation:tick .35s ease-out}
@keyframes tick{from{transform:translateY(-4px);color:var(--signal-ink)}}
.cd-c span{font-size:.72rem;color:var(--muted)}
.cd-now{font:600 1.05rem/1.3 var(--font-display);color:var(--signal-ink);display:flex;align-items:center;gap:8px}
.nu-empty{display:grid;gap:8px;padding:30px 24px;text-align:center;justify-items:center}
.nu-empty .ico{width:40px;height:40px;color:var(--muted)}

/* hero event slider */
.nu-wrap{display:grid;gap:16px;min-width:0}
.nu-slides{display:grid;touch-action:pan-y}
.nu-slide{grid-area:1/1;visibility:hidden;min-width:0}
.nu-slide.on{visibility:visible}
.nu-slide.from-next{animation:nuIn .5s cubic-bezier(.2,.8,.2,1)}
.nu-slide.from-prev{animation:nuInR .5s cubic-bezier(.2,.8,.2,1)}
.nu-slide.leaving{visibility:visible;pointer-events:none;animation:nuOut .32s ease forwards}
.nu-slide.leaving.to-prev{animation-name:nuOutR}
@keyframes nuIn{from{opacity:0;transform:translateX(calc(36px * var(--dx)))}}
@keyframes nuInR{from{opacity:0;transform:translateX(calc(-36px * var(--dx)))}}
@keyframes nuOut{to{opacity:0;transform:translateX(calc(-36px * var(--dx)))}}
@keyframes nuOutR{to{opacity:0;transform:translateX(calc(36px * var(--dx)))}}
.nu-label .tags{gap:6px}
.nu-ctrl{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--hero-fg)}
.nu-arrow{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--hero-fg) 30%,transparent);background:transparent;color:var(--hero-fg);cursor:pointer;transition:background .2s,border-color .2s}
.nu-arrow:hover{background:color-mix(in srgb,var(--hero-fg) 12%,transparent);border-color:var(--hero-fg)}
.nu-dots{display:flex;align-items:center;flex-wrap:wrap;justify-content:center}
.nu-dot{display:grid;place-items:center;height:30px;padding:0 4px;border:0;background:none;cursor:pointer}
.nu-dot i{position:relative;display:block;width:8px;height:8px;border-radius:99px;overflow:hidden;background:color-mix(in srgb,var(--hero-fg) 32%,transparent);transition:width .4s cubic-bezier(.2,.8,.2,1)}
.nu-dot.on i{width:34px}
.nu-dot.on i::after{content:"";position:absolute;inset:0;background:var(--hero-fg);transform-origin:left;animation:dotfill 7s linear forwards}
[dir="rtl"] .nu-dot.on i::after{transform-origin:right}
.nu-ctrl.paused .nu-dot.on i::after{animation-play-state:paused}
.nu-ctrl.static .nu-dot.on i::after{animation:none}
@keyframes dotfill{from{transform:scaleX(0)}}
.nu-count{font-size:.8rem;color:var(--hero-muted);min-width:3.4em;text-align:center}

/* event type */
.seg{display:inline-flex;justify-self:start;gap:4px;padding:4px;border-radius:999px;background:var(--surface-2)}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.seg span{display:block;padding:8px 18px;border-radius:999px;font-weight:600;font-size:.9rem;color:var(--muted);transition:background .2s,color .2s,box-shadow .2s}
.seg input:checked + span{background:var(--surface);color:var(--fg);box-shadow:var(--shadow-1)}
.seg input:focus-visible + span{outline:3px solid var(--signal);outline-offset:2px}
.chip.ini{background:var(--info-soft);color:var(--info)}
.chip .ico{width:1.1em;height:1.1em}

/* records tab */
.rec-bar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.rec-bar > div:first-child{display:grid;gap:12px;min-width:0}
.rec-actions{display:flex;gap:10px;flex-wrap:wrap}
.rec-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:24px}
.rec-tools .search{flex:1 1 260px;max-width:none}
.sel{min-height:50px;padding-inline:14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font-size:.92rem;cursor:pointer;max-width:100%}
.sel:focus{outline:none;border-color:var(--signal);box-shadow:0 0 0 4px color-mix(in srgb,var(--signal) 16%,transparent)}
.rec-sum{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.rtable-wrap{margin-top:14px;overflow-x:auto;border-radius:var(--r-m);background:var(--surface);box-shadow:var(--shadow-1)}
.rtable{width:100%;min-width:1240px;border-collapse:collapse;font-size:.9rem}
.rtable th{background:var(--hero);color:var(--hero-fg);font-weight:600;font-size:.82rem;text-align:start;padding:0;white-space:nowrap;border-inline-start:1px solid var(--hero-line)}
.rtable th:first-child{border-inline-start:0}
.rtable th button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:6px;width:100%;padding:13px 12px;cursor:pointer}
.rtable th button:focus-visible{outline:3px solid var(--hero-accent);outline-offset:-3px}
.rtable th .sa{opacity:.35;font-size:.7rem}
.rtable th[aria-sort] .sa{opacity:1;color:var(--hero-accent)}
.rtable td{padding:12px;border-top:1px solid var(--line);vertical-align:middle}
.rtable tbody tr{cursor:pointer;transition:background .15s}
.rtable tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface-2) 45%,var(--surface))}
.rtable tbody tr:hover,.rtable tbody tr:focus-visible{background:var(--surface-2);outline:none}
.rtable td.n,.rtable td.d{font-family:var(--font-data);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
.rtable td.n{text-align:center;width:44px}
.rtable td.a{font-weight:600;min-width:220px}
.rtable td.att{font-family:var(--font-data);font-variant-numeric:tabular-nums;text-align:end;font-weight:600}
.rtable .sticker{transform:none;font-size:.74rem}
.fl{display:inline-flex;align-items:center;gap:5px;font-weight:600;font-size:.82rem;white-space:nowrap}
.fl.ok{color:var(--ok)}.fl.no{color:var(--signal-ink)}.fl.na{color:var(--muted);font-weight:500}
.fl .ico{width:1.05em;height:1.05em}
.chip.cxl{background:var(--surface-2);color:var(--muted);text-decoration:line-through}
.chip.pp{background:var(--warn-soft);color:var(--warn)}
.rtable .sch{display:block;margin-top:3px;font-weight:400;font-size:.78rem;color:var(--muted)}
.sched{display:flex;gap:8px;align-items:flex-start;margin-top:-10px;color:var(--muted);font-size:.9rem}
.sched .ico{margin-top:4px}
.clink{color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.clink:hover{text-decoration-color:currentColor}
.rtable td.nt{max-width:260px;color:var(--muted);font-size:.84rem}
.rtable td.nt span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sheet.imp{width:min(1000px,100%)}
.imp-body{margin-top:0;padding-top:30px}
.imp-t{min-width:680px}
.imp-t td.d{white-space:normal}
.rtable td.pl{min-width:170px}
.imp-t th{padding:12px}
.imp-t tbody tr{cursor:default}
.imp-t tr.dup{opacity:.55}

/* club logos */
.plate{display:grid;place-items:center;aspect-ratio:1;width:56px;max-width:100%;border-radius:24%;background:#FFFFFF;box-shadow:0 0 0 1px rgba(13,26,48,.1),0 8px 18px -10px rgba(13,26,48,.45);overflow:hidden;flex:none}
.plate img{display:block;width:100%;height:100%;object-fit:contain}
.plate b{font:700 1.2em/1 var(--font-display);color:var(--c)}
.plate.xs{width:30px;border-radius:9px;font-size:.7rem}
.stk-group{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap;max-width:100%;min-width:0}
.stk-plus{font-weight:700;color:var(--muted);font-size:.8rem}
a.sticker{text-decoration:none;cursor:pointer}
a.sticker:hover{filter:brightness(1.15)}
.chip.collab{background:var(--info-soft);color:var(--info)}
.cover > .cover-art,.sheet-cover > .cover-art{display:block;position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.pcard:hover .cover > .cover-art{transform:scale(1.05)}
.cover-art > svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.cover-logos{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:5%;padding-bottom:3%}
.cover-logos .plate{width:31%;max-width:118px;border-radius:22%;transform:rotate(calc(-4deg * var(--dx)));box-shadow:0 16px 30px -12px rgba(0,0,0,.55)}
.cover-logos .plate + .plate{transform:rotate(calc(5deg * var(--dx)))}
.sheet-cover .cover-logos .plate{max-width:150px}

/* club wall (home) */
.cwall{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:22px 12px}
.cwall-h{font:600 .74rem/1.2 var(--font-data);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:12px}
:lang(ar) .cwall-h{letter-spacing:0;font-family:var(--font-body);font-size:.88rem}
.cwall-h::after{content:"";flex:1 1 40px;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 14px)}
.ctile{display:grid;justify-items:center;align-content:start;gap:9px;text-decoration:none;color:var(--fg);text-align:center;min-width:0;cursor:pointer}
.ct-wrap{position:relative;display:block;width:min(78px,100%)}
.ct-wrap .plate{width:100%;transition:transform .35s cubic-bezier(.2,.8,.2,1.4),box-shadow .35s}
.ctile:hover .plate,.ctile:focus-visible .plate{transform:translateY(-6px) rotate(calc(-5deg * var(--dx)));box-shadow:0 0 0 2px var(--c),0 18px 26px -12px rgba(13,26,48,.5)}
.ct-count{position:absolute;inset-block-start:-7px;inset-inline-end:-9px;min-width:24px;height:24px;padding:0 6px;border-radius:99px;background:var(--fg);color:var(--bg);font:600 .72rem/24px var(--font-data);text-align:center;box-shadow:0 0 0 2px var(--bg)}
.ct-name{font-weight:600;font-size:.82rem;line-height:1.25;overflow-wrap:anywhere}

/* clubs directory */
.ctabs{justify-self:start;display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:999px;background:var(--surface-2);margin-top:22px;max-width:100%}
.ctabs button{border:0;background:transparent;padding:9px 16px;border-radius:999px;font-weight:600;font-size:.9rem;color:var(--muted);cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.ctabs button:hover{color:var(--fg)}
.ctabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow-1)}
.ctabs .n{font:500 .76rem/1 var(--font-data);color:var(--muted);background:var(--surface-2);padding:4px 7px;border-radius:99px}
.cgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.ccard{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r-m);background:var(--surface);box-shadow:var(--shadow-1);text-decoration:none;color:var(--fg);min-width:0;transition:transform .3s cubic-bezier(.2,.8,.2,1.2),box-shadow .3s}
.ccard:hover,.ccard:focus-visible{transform:translateY(-4px);box-shadow:var(--shadow-2)}
.ccard .plate{width:64px}
.ccard > span:last-child{display:grid;gap:4px;min-width:0}
.ccard b{font:600 1rem/1.25 var(--font-display);overflow-wrap:anywhere}
.ccard small{color:var(--muted);font-size:.84rem}
.ccard small.up{color:var(--ok);font-weight:600}
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:16px}
.pair{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:var(--r-m);background:var(--surface);box-shadow:var(--shadow-1);min-width:0}
.pair-logos{display:flex;align-items:center;flex:none}
.pair-logos .plate{width:54px}
.pair-logos .plate + .plate{margin-inline-start:-14px;transform:rotate(calc(6deg * var(--dx)))}
.pair-txt{display:grid;gap:4px;min-width:0}
.pair-txt b{font:600 1rem/1.3 var(--font-display);overflow-wrap:anywhere}
.pair-txt b a{color:inherit;text-decoration:none}
.pair-txt b a:hover{text-decoration:underline}
.pair-txt small{color:var(--muted);font-size:.85rem}
.sec-h{font-size:1.4rem}

/* club profile */
.chero{position:relative;overflow:hidden;background:var(--hero);color:var(--hero-fg);isolation:isolate}
.chero::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(60% 110% at 90% -10%,color-mix(in srgb,var(--c) 60%,transparent),transparent 70%),radial-gradient(40% 80% at 0% 120%,color-mix(in srgb,var(--signal) 26%,transparent),transparent 70%),repeating-linear-gradient(0deg,var(--hero-line) 0 1px,transparent 1px 56px),repeating-linear-gradient(90deg,var(--hero-line) 0 1px,transparent 1px 56px)}
.chero-in{display:flex;align-items:center;gap:30px;padding-block:40px 104px;flex-wrap:wrap}
.chero .plate.hero-plate{width:136px;border-radius:32px;box-shadow:0 22px 50px -18px rgba(0,0,0,.75);animation:plateIn .8s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes plateIn{from{transform:scale(.55) rotate(-14deg)}}
.chero-txt{display:grid;gap:12px;min-width:0;flex:1 1 320px}
.chero h1{font-size:clamp(2rem,4.4vw,3.1rem);font-weight:700;letter-spacing:-.02em;overflow-wrap:anywhere}
:lang(ar) .chero h1{letter-spacing:0}
.chero .sub{color:var(--hero-muted);font-size:1.02rem}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--hero-muted);text-decoration:none;font-size:.9rem;justify-self:start;cursor:pointer}
.back:hover{color:var(--hero-fg)}
.chip.on-dark{background:rgba(242,245,250,.12);color:var(--hero-fg)}
.partners{display:flex;flex-wrap:wrap;gap:10px}
.partner{display:inline-flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow-1);text-decoration:none;color:var(--fg);font-weight:600;font-size:.9rem}
[dir="rtl"] .partner{padding:6px 6px 6px 14px}
.partner:hover{box-shadow:0 0 0 2px var(--c),var(--shadow-1)}
.partner small{font:500 .76rem/1 var(--font-data);color:var(--muted)}

/* header clubs menu */
.nav-dd{display:flex}
.mega{display:none;position:absolute;top:calc(100% + 12px);inset-inline-end:0;z-index:35;width:min(900px,calc(100vw - 32px));padding:18px;border-radius:var(--r-l);background:var(--surface);box-shadow:var(--shadow-2);border:1px solid var(--line);gap:10px;animation:megaIn .22s ease}
.mega::before{content:"";position:absolute;inset-inline:0;top:-16px;height:16px}
@keyframes megaIn{from{opacity:0;transform:translateY(-6px)}}
@media (hover:hover) and (min-width:961px){.nav-dd:hover .mega,.nav-dd:focus-within .mega{display:grid}.nav-dd.shut .mega{display:none}}
.mg-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-inline:8px}
.mg-head b{font:600 .72rem/1 var(--font-data);letter-spacing:.12em;text-transform:uppercase;color:var(--signal-ink)}
:lang(ar) .mg-head b{letter-spacing:0;font-family:var(--font-body);font-size:.85rem}
.mg-head a{display:inline-flex;gap:6px;align-items:center;font-size:.85rem;font-weight:600;color:var(--fg);text-decoration:none}
.mg-head a:hover{color:var(--signal-ink)}
.mg-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;margin-bottom:6px}
.mg-i{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;text-decoration:none;color:var(--fg);font-size:.86rem;font-weight:500;min-width:0}
.mg-i span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mg-i:hover,.mg-i:focus-visible{background:var(--surface-2)}

/* demo role switcher */
.demo{background:var(--fg);color:var(--bg);font-size:.84rem}
.demo-in{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding-block:8px}
.demo-tag{font:600 .7rem/1 var(--font-data);letter-spacing:.14em;text-transform:uppercase;background:var(--signal);color:var(--on-signal);padding:5px 8px;border-radius:6px}
:lang(ar) .demo-tag{letter-spacing:0;font-family:var(--font-body);font-size:.8rem}
.demo-lbl{font-weight:600}
.demo-seg{display:inline-flex;gap:3px;padding:3px;border-radius:999px;background:color-mix(in srgb,var(--bg) 16%,transparent)}
.demo-seg button{border:0;background:transparent;color:inherit;opacity:.78;padding:6px 14px;border-radius:999px;font-weight:600;font-size:.84rem;cursor:pointer}
.demo-seg button:hover{opacity:1}
.demo-seg button[aria-checked="true"]{background:var(--bg);color:var(--fg);opacity:1}
.demo .sel{min-height:34px;padding-inline:12px;font-size:.84rem;background:var(--bg);color:var(--fg);border-color:transparent;max-width:min(320px,100%)}
.demo-note{opacity:.72;margin-inline-start:auto}

/* review flow */
.nbadge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--signal);color:var(--on-signal);font:600 .7rem/1 var(--font-data)}
.chip.rvp{background:var(--warn-soft);color:var(--warn)}
.chip.rvr{background:var(--signal-soft);color:var(--signal-ink)}
.rv{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:var(--r-m);border:1.5px solid}
.rv > div:first-child{display:flex;gap:10px;align-items:flex-start;min-width:0;flex:1 1 280px}
.rv > div:first-child > .ico{margin-top:3px}
.rv p{display:grid;gap:2px;font-size:.9rem;min-width:0}
.rv p span{overflow-wrap:anywhere}
.rv.pend{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.rv.pend > div:first-child > .ico{color:var(--warn)}
.rv.ret{background:var(--signal-soft);border-color:color-mix(in srgb,var(--signal) 35%,transparent)}
.rv.ret > div:first-child > .ico{color:var(--signal-ink)}
.rv-ret{display:grid;gap:8px;width:min(440px,100%)}
.rv-ret label{font-weight:600;font-size:.88rem}
.rv-ret textarea{width:100%;min-height:76px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);resize:vertical;line-height:1.5}
.rv-ret textarea:focus{outline:none;border-color:var(--signal);box-shadow:0 0 0 4px color-mix(in srgb,var(--signal) 16%,transparent)}
.qlist{display:grid;gap:12px}
.qitem{display:flex;flex-wrap:wrap;align-items:center;gap:14px 18px;padding:16px 18px;border-radius:var(--r-m);background:var(--surface);box-shadow:var(--shadow-1)}
.qitem > .plate{width:52px}
.q-main{display:grid;gap:6px;flex:1 1 300px;min-width:0}
.q-main h3{font-size:1.08rem;overflow-wrap:anywhere}
.q-main h3 a{color:inherit;text-decoration:none}
.q-main h3 a:hover{text-decoration:underline}
.q-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;color:var(--muted);font-size:.86rem}
.q-meta .ico + span{margin-inline-end:6px}
.q-note{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--fg);font-size:.88rem}
.q-note .ico{color:var(--warn);margin-top:3px}
.q-sub{font-size:.8rem;color:var(--muted)}
.q-act{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center;flex:0 1 auto}
.dash-sec{display:grid;gap:14px;padding-top:34px}
.dash-sec h2{font-size:1.3rem;display:flex;align-items:center;gap:10px}
.dash-sec h2 .n{font:500 .8rem/1 var(--font-data);color:var(--muted);background:var(--surface-2);padding:5px 8px;border-radius:999px}
.locked{display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 12px;border-radius:12px;border:1.5px dashed var(--line);background:var(--surface-2);font-weight:600}

/* stats */
.stats{position:relative;z-index:2;margin-top:-52px}
.stats-in{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border-radius:var(--r-l);box-shadow:var(--shadow-1);overflow:hidden}
.stat{display:grid;align-content:start;gap:4px;padding:22px 24px;border-inline-start:1px solid var(--line)}
.stat:first-child{border-inline-start:0}
.stat b{font:600 2.1rem/1 var(--font-data);font-variant-numeric:tabular-nums;color:var(--fg)}
.stat b small{font-size:.55em;color:var(--signal-ink);margin-inline-start:2px}
.stat span{color:var(--muted);font-size:.9rem}
.stat em{font-style:normal;font-size:.78rem;color:var(--muted);opacity:.8}

/* sections */
.block{padding-block:64px 8px;display:grid;gap:24px}
.block-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.block-head > div{display:grid;gap:8px;min-width:0}
.block-head h2{font-size:clamp(1.7rem,3.2vw,2.35rem)}
.block-head p{color:var(--muted);max-width:60ch}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.fchip{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:.88rem;font-weight:500;color:var(--fg);transition:border-color .2s,background .2s,color .2s}
.fchip .dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted))}
.fchip:hover{border-color:var(--fg)}
.fchip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.grid{display:grid;gap:22px}
.tickets{grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.empty{display:grid;justify-items:center;gap:10px;text-align:center;padding:44px 20px;border:2px dashed var(--line);border-radius:var(--r-l);color:var(--muted)}
.empty .ico{width:38px;height:38px}
.notice{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px 18px;border-radius:var(--r-m);background:var(--warn-soft);color:var(--fg);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.notice p{display:flex;gap:10px;align-items:flex-start;min-width:0;flex:1 1 320px;font-size:.92rem}
.notice .ico{color:var(--warn);margin-top:3px}
.rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes rise{from{transform:translateY(22px)}}


/* past cards */
.pgrid{grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr))}
.pcard{display:grid;background:var(--surface);border-radius:var(--r-m);overflow:hidden;box-shadow:var(--shadow-1);text-decoration:none;color:var(--fg);cursor:pointer;transition:transform .3s cubic-bezier(.2,.8,.2,1.2),box-shadow .3s;min-width:0}
.pcard:hover{transform:translateY(-5px);box-shadow:var(--shadow-2)}
.cover{position:relative;aspect-ratio:16/10;max-width:100%;overflow:hidden;background:var(--c)}
.cover > img,.cover > svg{display:block;width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.pcard:hover .cover > img,.pcard:hover .cover > svg{transform:scale(1.05)}
.cover .badge{position:absolute;inset-block-end:10px;inset-inline-start:10px;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:rgba(5,10,20,.68);color:#F2F5FA;font:500 .76rem/1 var(--font-data);backdrop-filter:blur(4px)}
:lang(ar) .cover .badge{font-family:var(--font-body)}
.pbody{display:grid;gap:9px;padding:16px 18px 18px;min-width:0}
.pbody h3{font-size:1.1rem;overflow-wrap:anywhere}
.pbody .meta{font-size:.86rem}

/* page heads */
.page-head{padding-block:48px 8px;display:grid;gap:12px}
.page-head h1{font-size:clamp(2.1rem,4.6vw,3.3rem);font-weight:700;letter-spacing:-.02em}
:lang(ar) .page-head h1{letter-spacing:0}
.page-head p{color:var(--muted);max-width:62ch;font-size:1.05rem}
.toolbar{display:grid;gap:14px;margin-top:22px}
.search{position:relative;max-width:520px}

function t(k,v){var p=T[k];var s=p?(lang==='ar'?p[1]:p[0]):k;if(v)Object.keys(v).forEach(function(x){s=s.split('{'+x+'}').join(v[x]);});return s;}
function plural(n,en1,enN,ar1,ar2,arFew,arMany){
  if(lang!=='ar')return n+' '+(n===1?en1:enN);
  if(n===1)return ar1;if(n===2)return ar2;if(n>=3&&n<=10)return n+' '+arFew;return n+' '+arMany;}

function newId(){return 'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

function parseD(s){var p=String(s||'').split('-').map(Number);return new Date(p[0]||1970,(p[1]||1)-1,p[2]||1);}
function evTime(ev){var d=parseD(ev.date);var tm=String(ev.time||'00:00').split(':').map(Number);d.setHours(tm[0]||0,tm[1]||0,0,0);return d;}
function dayDiff(s){var a=parseD(s),n=new Date();var b=new Date(n.getFullYear(),n.getMonth(),n.getDate());return Math.round((a-b)/864e5);}
function locD(){return lang==='ar'?'ar-JO-u-nu-latn':'en-GB';}

function fMon(ev){return fmt(parseD(ev.date),{month:'short'});}
function fDay(ev){return String(parseD(ev.date).getDate());}
function fWd(ev){return fmt(parseD(ev.date),{weekday:'short'});}
function endOf(ev){return ev.end&&ev.end>ev.date?ev.end:ev.date;}
function fLong(ev){var s=parseD(ev.date);if(endOf(ev)===ev.date)return fmt(s,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  return fmt(s,{weekday:'short',day:'numeric',month:'short'})+' – '+fmt(parseD(ev.end),{weekday:'short',day:'numeric',month:'short',year:'numeric'});}
function fCell(ds){return ds?fmt(parseD(ds),{day:'2-digit',month:'short',year:'numeric'}):'—';}
function fShort(ev){return fmt(parseD(ev.date),{day:'numeric',month:'short',year:'numeric'});}
function fClock(hmv){var p=String(hmv).split(':').map(Number),d=new Date(2000,0,1,p[0]||0,p[1]||0);return fmt(d,{hour:'numeric',minute:'2-digit'},locT());}
function fTime(ev){if(!ev.time)return '';return fClock(ev.time)+(ev.timeEnd?' – '+fClock(ev.timeEnd):'');}
function fSize(b){if(!b&&b!==0)return '';if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(0)+' KB';return (b/1048576).toFixed(1)+' MB';}

var ORG_BY_KEY={},ORG_BY_ID={},ADHOC={},OCACHE={};
ORGS.forEach(function(o){o.logo=LOGOS[o.id]||'';ORG_BY_ID[o.id]=o;o.keys.concat([o.name,o.tag,o.ar]).forEach(function(k){var kk=orgKey(k);if(kk&&!ORG_BY_KEY[kk])ORG_BY_KEY[kk]=o;});});
function byName(a,b){return a.name.localeCompare(b.name);}
function orgFor(name){var n=clean(name);if(!n)return null;var k=orgKey(n)||n.toLowerCase();if(ORG_BY_KEY[k])return ORG_BY_KEY[k];
  if(!ADHOC[k])ADHOC[k]={id:'x-'+(k.replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||hashStr(k).toString(36)),name:n,tag:n,sub:'',cat:isInitiative(n)?'initiative':'club',color:CLUB_COLORS[hashStr(k)%CLUB_COLORS.length],logo:'',adhoc:true};
  return ADHOC[k];}
function orgsOfStr(s){s=String(s||'');if(OCACHE[s])return OCACHE[s];var seen={},out=[];splitOrgs(s).forEach(function(p){var o=orgFor(p);if(o&&!seen[o.id]){seen[o.id]=1;out.push(o);}});return (OCACHE[s]=out);}
function orgsOf(ev){return orgsOfStr(ev&&ev.club);}
function clubLabel(s){return orgsOfStr(s).map(function(o){return o.name;}).join(' + ');}
function isCollab(ev){return orgsOf(ev).length>1;}
function hasOrg(ev,id){return orgsOf(ev).some(function(o){return o.id===id;});}
function orgEvents(id){return pubEvents().filter(function(e){return hasOrg(e,id);});}
function presentOrgs(all){var m={},out=[];(all?STATE.events:pubEvents()).forEach(function(e){orgsOf(e).forEach(function(o){if(!m[o.id]){m[o.id]=1;out.push(o);}});});return out.sort(byName);}
function orgById(id){if(ORG_BY_ID[id])return ORG_BY_ID[id];var p=presentOrgs();for(var i=0;i<p.length;i++)if(p[i].id===id)return p[i];return null;}
function dirOrgs(cat){var list=ORGS.filter(function(o){return o.cat===cat;});presentOrgs().forEach(function(o){if(o.adhoc&&o.cat===cat)list.push(o);});return list.sort(byName);}
function evText(e){return (e.activity+' '+e.club+' '+orgsOf(e).map(function(o){return o.name+' '+o.tag;}).join(' ')+' '+(e.place||'')).toLowerCase();}
function logoPlate(o,cls,alt){return '<span class="plate'+(cls?' '+cls:'')+'" style="--c:'+o.color+'">'+(o.logo?'<img src="'+o.logo+'" alt="'+h(alt||'')+'" decoding="async">':'<b'+(alt?' role="img" aria-label="'+h(alt)+'"':'')+'>'+h(initials(o.name))+'</b>')+'</span>';}
STATE.events.forEach(function(e){var l=clubLabel(e.club);if(l)e.club=l;});
function cc(club){var o=orgsOfStr(club)[0];return o?o.color:CLUB_COLORS[0];}
function initials(club){
  var s=String(club||'').trim();
  if(/[؀-ۿ]/.test(s)){s=s.replace(/^نادي\s+/,'').replace(/^ال/,'');return s.charAt(0)||'؟';}
  var w=s.replace(/\b(club|society|team|htu)\b/ig,'').trim().split(/\s+/).filter(Boolean);
  return ((w[0]||'?').charAt(0)+(w[1]?w[1].charAt(0):'')).toUpperCase();}
function blob(id){return LOCAL_URLS[id]||'/_blob/'+id;}

/* ---------- generated covers (until real photos arrive) ---------- */
function coverSVG(club,noText){
  var os=orgsOfStr(club),c=cc(club),c2=os[1]?os[1].color:'',hsh=hashStr(String(club||'')),v=hsh%4,ini=h(initials(club)),g='';
  if(v===0){g='<g fill="none" stroke="#FFFFFF" stroke-opacity=".22" stroke-width="12">'+[46,92,138,184,230].map(function(r){return '<circle cx="340" cy="210" r="'+r+'"/>';}).join('')+'</g>';}
  else if(v===1){var s='';for(var i=-6;i<16;i++)s+='<path d="M'+(i*40)+' 260L'+(i*40+260)+' 0" />';g='<g stroke="#FFFFFF" stroke-opacity=".16" stroke-width="14">'+s+'</g>';}
  else if(v===2){var d='';for(var y=20;y<260;y+=30)for(var x=20;x<420;x+=30)d+='<circle cx="'+x+'" cy="'+y+'" r="3.5"/>';g='<g fill="#FFFFFF" fill-opacity=".22">'+d+'</g>';}
  else{var p='';[[300,60],[360,150],[250,190],[340,230],[200,80]].forEach(function(q,i){var z=16+i*5;p+='<path d="M'+q[0]+' '+(q[1]-z)+'V'+(q[1]+z)+'M'+(q[0]-z)+' '+q[1]+'H'+(q[0]+z)+'"/>';});g='<g stroke="#FFFFFF" stroke-opacity=".3" stroke-width="9" stroke-linecap="round">'+p+'</g>';}
  return '<svg viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="400" height="250" fill="'+c+'"/>'+(c2?'<path d="M236 0H400V250H164Z" fill="'+c2+'"/>':'')+g+
    (noText?'':'<text x="28" y="214" fill="#FFFFFF" fill-opacity=".92" font-family="Readex Pro, IBM Plex Sans Arabic, sans-serif" font-weight="700" font-size="104">'+ini+'</text>')+'</svg>';}
function coverArt(club){var os=orgsOfStr(club);if(!os.length)return coverSVG(club);return '<div class="cover-art">'+coverSVG(club,true)+'<div class="cover-logos">'+os.slice(0,3).map(function(o){return logoPlate(o);}).join('')+'</div></div>';}
function photoImg(p,alt,eager){return '<img src="'+blob(p.id)+'" alt="'+h(alt)+'" '+(eager?'':'loading="lazy" ')+'decoding="async" data-ph>';}

/* ---------- small pieces ---------- */
function sticker(club,link){var os=String(club||'').trim()?orgsOfStr(club):[];
  if(!os.length)return '<span class="sticker" style="--c:'+CLUB_COLORS[0]+'" dir="auto">'+h(club||t('fClub'))+'</span>';
  return '<span class="stk-group">'+os.map(function(o,i){return (i?'<span class="stk-plus" aria-hidden="true">+</span>':'')+(link?'<a class="sticker" href="#club-'+h(o.id)+'" data-club="'+h(o.id)+'" style="--c:'+o.color+'" title="'+h(o.name)+'" dir="auto">'+h(o.tag)+'</a>':'<span class="sticker" style="--c:'+o.color+'" title="'+h(o.name)+'" dir="auto">'+h(o.tag)+'</span>');}).join('')+'</span>';}
function statusChip(ev){if(ev.status==='cancelled')return '<span class="chip cxl">'+t('s_cancelled')+'</span>';if(ev.status==='postponed')return '<span class="chip pp">'+t('s_postponed')+'</span>';var s=status(ev);
  if(s==='today')return '<span class="chip live"><span class="dot"></span>'+t('stToday')+'</span>';
  if(s==='up')return '<span class="chip ok">'+t('stUpcoming')+'</span>';
  return '<span class="chip">'+t('stDone')+'</span>';}
function lifeChip(ev){return ev.status==='cancelled'?'<span class="chip cxl">'+t('s_cancelled')+'</span>':ev.status==='postponed'?'<span class="chip pp">'+t('s_postponed')+'</span>':'';}
function kindChip(ev){return ev&&isCollab(ev)?'<span class="chip collab">'+I.link+t('collab')+'</span>':'';}
function sampleChip(ev){return ev.sample?'<span class="chip sample">'+t('sample')+'</span>':'';}
function dueChip(ev){return (canManage(ev)&&isLive(ev)&&reportKey(ev)==='missing')?'<span class="chip warn">'+I.file+t('reportDue')+'</span>':'';}
function whenText(ev){var d=dayDiff(ev.date);if(d<=0)return t('today');if(d===1)return t('tomorrow');return inDays(d);}

function ticketHTML(ev,opts){
  opts=opts||{};var c=cc(ev.club);
  var inner='<div class="stub"><span class="mon">'+h(ev.date?fMon(ev):'—')+'</span><span class="day">'+h(ev.date?fDay(ev):'00')+'</span><span class="wd">'+h(ev.date?fWd(ev):'')+'</span></div>'+
    '<div class="tbody"><div class="tags">'+sticker(ev.club||t('fClub'))+lifeChip(ev)+kindChip(ev)+sampleChip(ev)+'</div>'+
    '<h3 dir="auto">'+h(opts.preview?(ev.activity||t('fActivity')):actName(ev))+'</h3>'+
    '<ul class="meta">'+(ev.end&&ev.end>ev.date?'<li>'+I.cal+'<span>'+h(fLong(ev))+'</span></li>':'')+'<li>'+I.clock+'<span>'+h(fTime(ev)||'—')+'</span></li><li>'+I.pin+'<span dir="auto">'+h(ev.place||(opts.preview?t('fPlace'):'—'))+'</span></li></ul>'+
    (ev.date?'<span class="when">'+h(whenText(ev))+'</span>':'')+'</div>';
  if(opts.preview)return '<div class="ticket" style="--c:'+c+';--notch:var(--surface);cursor:default">'+inner+'</div>';
  return '<a class="ticket" href="#event-'+h(ev.id)+'" data-open="'+h(ev.id)+'" style="--c:'+c+'">'+inner+'</a>';}

function pcardHTML(ev){
  var c=cc(ev.club),n=ev.photos.length;
  var cov=n?photoImg(ev.photos[0],'',false):coverArt(ev.club);
  return '<a class="pcard" href="#event-'+h(ev.id)+'" data-open="'+h(ev.id)+'" style="--c:'+c+'"><div class="cover">'+cov+
    '<span class="badge">'+I.cam+h(n?nPhotos(n):t('noPhotos'))+'</span></div>'+
    '<div class="pbody"><div class="tags">'+sticker(ev.club)+lifeChip(ev)+kindChip(ev)+sampleChip(ev)+dueChip(ev)+'</div><h3 dir="auto">'+h(actName(ev))+'</h3>'+
    '<ul class="meta"><li>'+I.cal+'<span>'+h(fShort(ev))+'</span></li><li>'+I.pin+'<span dir="auto">'+h(ev.place||'—')+'</span></li></ul></div></a>';}

function localNotice(){return (caps.local&&caps.canEdit&&!LOCAL_EDIT)?'<div class="notice"><p>'+I.info+'<span>'+t('localNote')+'</span></p></div>':'';}
function sampleNotice(){

function cdParts(ms){ms=Math.max(0,ms);return {d:Math.floor(ms/864e5),h:Math.floor(ms%864e5/36e5),m:Math.floor(ms%36e5/6e4),s:Math.floor(ms%6e4/1e3)};}
function cdHTML(ev){var target=evTime(ev).getTime(),p=cdParts(target-Date.now());
  return target>Date.now()?'<div class="cd" data-cd="'+target+'" role="timer">'+
    [['d','days'],['h','hrs'],['m','mins'],['s','secs']].map(function(u){return '<div class="cd-c"><b data-u="'+u[0]+'">'+pad(p[u[0]])+'</b><span>'+t(u[1])+'</span></div>';}).join('')+'</div>'
    :'<p class="cd-now"><span class="chip live"><span class="dot"></span>'+t('stToday')+'</span>'+t('happening')+'</p>';}
function nextUpHTML(){
  var up=upcoming().filter(function(e){return e.status!=='cancelled'&&e.status!=='postponed'&&dayDiff(e.date)>=0;}).slice(0,8),n=up.length;
  if(!n)return '<div class="nu-wrap"><aside class="nextup" aria-label="'+h(t('nextUp'))+'"><div class="nu-empty">'+I.cal+'<h2>'+t('noNext')+'</h2><p style="color:var(--muted)">'+t('noNextSub')+'</p></div></aside></div>';
  if(!(S.slide>=0&&S.slide<n))S.slide=0;
  var slides=up.map(function(ev,i){var on=i===S.slide;
    return '<div class="nu-slide'+(on?' on':'')+'" data-slide="'+i+'" role="group" aria-roledescription="slide" aria-label="'+(i+1)+' / '+n+'"'+(on?'':' aria-hidden="true" inert')+'>'+
      '<div class="nu-top"><div class="nu-label"><span class="eyebrow">'+t(i===0?'nextUp':'comingUp')+'</span><span class="tags">'+kindChip(ev)+sampleChip(ev)+'</span></div>'+
      '<div class="tags">'+sticker(ev.club)+'</div><h2 dir="auto">'+h(actName(ev))+'</h2>'+
      '<ul class="meta"><li>'+I.cal+'<span>'+h(fLong(ev))+'</span></li><li>'+I.clock+'<span>'+h(fTime(ev)||'—')+'</span></li><li>'+I.pin+'<span dir="auto">'+h(ev.place||'—')+'</span></li></ul></div>'+
      '<div class="nu-perf"></div><div class="nu-bottom">'+cdHTML(ev)+'<button class="btn primary" type="button" data-open="'+h(ev.id)+'">'+t('details')+I.arrow+'</button></div></div>';}).join('');
  var ctrl=n>1?'<div class="nu-ctrl'+(RM.matches?' static':'')+'"><button class="nu-arrow" type="button" data-slide-step="-1" aria-label="'+h(t('prevEv'))+'">'+I.left+'</button>'+
    '<div class="nu-dots">'+up.map(function(ev,i){var on=i===S.slide;return '<button class="nu-dot'+(on?' on':'')+'" type="button" data-slide-to="'+i+'" aria-label="'+h(t('goEv',{n:i+1,name:ev.activity}))+'"'+(on?' aria-current="true"':'')+'><i></i></button>';}).join('')+'</div>'+
    '<span class="nu-count mono" id="nu-count">'+(S.slide+1)+' / '+n+'</span><button class="nu-arrow" type="button" data-slide-step="1" aria-label="'+h(t('nextEv'))+'">'+I.right+'</button></div>':'';
  return '<div class="nu-wrap"><aside class="nextup" aria-roledescription="carousel" aria-label="'+h(t('nextUp'))+'"><div class="nu-slides" id="nu-slides">'+slides+'</div></aside>'+ctrl+'</div>';}
function showSlide(i,dir){
  var box=document.getElementById('nu-slides');if(!box)return;var sl=box.querySelectorAll('.nu-slide'),n=sl.length;if(n<2)return;
  i=((i%n)+n)%n;if(i===S.slide)return;var old=sl[S.slide];S.slide=i;
  if(old){old.classList.remove('on','from-next','from-prev');old.classList.add('leaving');old.classList.toggle('to-prev',dir<0);old.setAttribute('aria-hidden','true');old.inert=true;
    setTimeout(function(){old.classList.remove('leaving','to-prev');},340);}
  var cur=sl[i];cur.classList.remove('leaving','to-prev','from-next','from-prev');cur.removeAttribute('aria-hidden');cur.inert=false;cur.classList.add('on');void cur.offsetWidth;cur.classList.add(dir<0?'from-prev':'from-next');
  document.querySelectorAll('.nu-dot').forEach(function(d,k){var on=k===i;d.classList.toggle('on',on);if(on)d.setAttribute('aria-current','true');else d.removeAttribute('aria-current');});
  var c=document.getElementById('nu-count');if(c)c.textContent=(i+1)+' / '+n;}
function syncAuto(){var c=document.querySelector('.nu-ctrl');if(c)c.classList.toggle('paused',!!(S.openId||S.hover||S.focusIn||document.hidden));}
function bindSlider(){var w=document.querySelector('.nu-wrap');S.hover=false;S.focusIn=false;if(!w)return;
  w.addEventListener('mouseenter',function(){S.hover=true;syncAuto();});w.addEventListener('mouseleave',function(){S.hover=false;syncAuto();});
  w.addEventListener('focusin',function(){S.focusIn=true;syncAuto();});w.addEventListener('focusout',function(e){if(!w.contains(e.relatedTarget)){S.focusIn=false;syncAuto();}});syncAuto();}
function yearStats(){var now=new Date(),y=now.getFullYear(),ys=String(y);
  var ev=pubEvents().filter(function(e){return String(e.date||'').slice(0,4)===ys&&e.status!=='cancelled';});
  var cm={},im={},maxM=0;ev.forEach(function(e){orgsOf(e).forEach(function(o){if(o.cat==='initiative')im[o.id]=1;else cm[o.id]=1;});var m=+String(e.date).slice(5,7);if(m>maxM)maxM=m;});
  var months=Math.max(now.getMonth()+1,maxM,1);
  return {y:y,n:ev.length,clubs:Object.keys(cm).length,ini:Object.keys(im).length,avg:Math.round(ev.length/months),months:months};}
function statHTML(v,dec,label,sub){return '<div class="stat"><b data-count="'+v+'"'+(dec?' data-dec="'+dec+'"':'')+'>'+(dec?v.toFixed(dec):v)+'</b><span>'+label+'</span>'+(sub?'<em>'+sub+'</em>':'')+'</div>';}

  var up=upcoming(),ps=past(),ys=yearStats();

  if(S.fUp!=='all'&&!upClubs[S.fUp])S.fUp='all';
  var list=S.fUp==='all'?up:up.filter(function(e){return hasOrg(e,S.fUp);});

    '<section class="stats wrap" aria-label="'+h(t('stCap',{y:ys.y}))+'"><div class="stats-in">'+
      statHTML(ys.n,0,t('stEv',{y:ys.y}),'')+statHTML(ys.clubs,0,t('stClubs'),'')+statHTML(ys.ini,0,t('stIni'),'')+statHTML(ys.avg,0,t('stAvg'),nMonths(ys.months))+'</div></section>'+
    '<section class="wrap block" id="upcoming">'+sampleNotice()+
      '<div class="block-head"><div><p class="eyebrow">'+t('navHome')+'</p><h2>'+t('upTitle')+'</h2><p>'+t('upSub')+'</p></div>'+(isStaff()?'<a class="btn quiet" href="#add" data-go="add" data-fresh>'+I.plus+t('addCta')+'</a>':'')+'</div>'+
      (chips.length>1?'<div class="filters" role="group" aria-label="'+h(t('lClub'))+'"><button class="fchip" type="button" data-fup="all" aria-pressed="'+(S.fUp==='all')+'">'+t('allClubs')+'</button>'+
        chips.map(function(o){return '<button class="fchip" type="button" data-fup="'+h(o.id)+'" aria-pressed="'+(S.fUp===o.id)+'" style="--c:'+o.color+'"><span class="dot"></span><span dir="auto">'+h(o.tag)+'</span></button>';}).join('')+'</div>':'')+
      (list.length?'<div class="grid tickets">'+list.map(function(e){return ticketHTML(e);}).join('')+'</div>'
        :'<div class="empty">'+I.cal+'<p>'+(up.length?t('upEmptyF'):t('upEmpty'))+'</p></div>')+'</section>'+
    homeClubsHTML()+
    '<section class="wrap block"><div class="block-head"><div><p class="eyebrow">'+t('navPast')+'</p><h2>'+t('archTitle')+'</h2><p>'+t('archSub')+'</p></div>'+

      (ps.length?'<div class="grid pgrid">'+ps.slice(0,3).map(pcardHTML).join('')+'</div>':'<div class="empty">'+I.cam+'<p>'+t('archEmpty')+'</p></div>')+'</section>';}

var CT={tab:'clubs'};
function collabEvents(){return pubEvents().filter(isCollab).sort(function(a,b){return evTime(b)-evTime(a);});}

function viewClubs(){
  var cl=dirOrgs('club'),ini=dirOrgs('initiative'),co=collabEvents(),tab=CT.tab;
  var tabs=[['clubs',t('tabClubs'),cl.length],['ini',t('tabIni'),ini.length],['collabs',t('tabCollab'),co.length]];
  var body;
  if(tab==='collabs'){
    var pm={},pl=[];co.forEach(function(e){var os=orgsOf(e),k=os.map(function(o){return o.id;}).sort().join('|');if(!pm[k]){pm[k]={orgs:os,n:0};pl.push(pm[k]);}pm[k].n++;});
    body=co.length?'<section class="block" style="padding-top:28px"><h2 class="sec-h">'+t('pairs')+'</h2><div class="pairs">'+pl.map(function(pp){
        return '<div class="pair" style="--c:'+pp.orgs[0].color+'"><span class="pair-logos">'+pp.orgs.map(function(o){return logoPlate(o);}).join('')+'</span><span class="pair-txt"><b dir="auto">'+

      '<section class="block" style="padding-top:36px"><h2 class="sec-h">'+t('collabEvents')+'</h2><div class="grid pgrid">'+co.map(pcardHTML).join('')+'</div></section>'
      :'<div class="empty" style="margin-top:28px">'+I.link+'<p>'+t('collabNone')+'</p></div>';
  }else body='<div class="cgrid" style="margin-top:28px">'+(tab==='ini'?ini:cl).map(clubCard).join('')+'</div>';
  return '<section class="wrap page-head"><p class="eyebrow">'+t('navClubs')+'</p><h1>'+t('clubsTitle')+'</h1><p>'+h(t('clubsSub',{c:cl.length,i:ini.length}))+'</p>'+
    '<div class="ctabs" role="tablist" aria-label="'+h(t('navClubs'))+'">'+tabs.map(function(x){return '<button type="button" role="tab" data-ctab="'+x[0]+'" aria-selected="'+(tab===x[0])+'">'+x[1]+'<span class="n">'+x[2]+'</span></button>';}).join('')+'</div></section>'+
    '<div class="wrap" role="tabpanel">'+body+'</div>';}
function viewClub(){
  var o=orgById(S.clubId);
  if(!o)return '<section class="wrap"><div class="card lock">'+I.club+'<h2>'+t('pfMissing')+'</h2><a class="btn quiet" href="#clubs" data-go="clubs">'+t('seeClubs')+'</a></div></section>';
  var ev=orgEvents(o.id),y=new Date().getFullYear(),ys=String(y);
  var inYear=ev.filter(function(e){return String(e.date).slice(0,4)===ys&&e.status!=='cancelled';}).length;
  var up=ev.filter(isUp).sort(function(a,b){return evTime(a)-evTime(b);}),done=ev.filter(function(e){return !isUp(e);}).sort(function(a,b){return evTime(b)-evTime(a);});
  var co=ev.filter(isCollab),pm={};co.forEach(function(e){orgsOf(e).forEach(function(q){if(q.id!==o.id){if(!pm[q.id])pm[q.id]={o:q,n:0};pm[q.id].n++;}});});
  var partners=Object.keys(pm).map(function(k){return pm[k];}).sort(function(a,b){return b.n-a.n;});
  var live=ev.filter(function(e){return e.status!=='cancelled';}),pa=live.filter(function(e){return e.hasPermit;}).length,dn=done.filter(function(e){return e.status!=='cancelled';}),ra=dn.filter(function(e){return e.hasReport;}).length,att=ev.reduce(function(a,e){return a+(+e.att||0);},0);
  return '<section class="chero" style="--c:'+o.color+'"><div class="wrap chero-in">'+logoPlate(o,'hero-plate',t('logoOf',{name:o.name}))+
      '<div class="chero-txt"><a class="back" href="#clubs" data-go="clubs">'+I.left+t('seeClubs')+'</a>'+
      '<div class="tags"><span class="chip on-dark">'+t(o.cat==='initiative'?'catIni':'catClub')+'</span></div><h1 dir="auto">'+h(o.name)+'</h1>'+(o.sub?'<p class="sub">'+h(o.sub)+'</p>':'')+
      (canClub(o.id)?'<div class="cta"><button class="btn primary" type="button" data-act="add-club" data-cid="'+h(o.id)+'">'+I.plus+t('navAdd')+'</button>'+(clubRole()===o.id?'<a class="btn ghost" href="#mine" data-go="mine">'+I.table+t('navMine')+'</a>':'')+'</div>':'')+'</div></div></section>'+
    '<section class="stats wrap" aria-label="'+h(t('pfCap',{name:o.name}))+'"><div class="stats-in">'+
      statHTML(inYear,0,t('stEv',{y:y}),'')+statHTML(up.length,0,t('pfUp'),'')+statHTML(done.length,0,t('pfDone'),'')+statHTML(co.length,0,t('pfCollab'),'')+'</div></section>'+
    (canClub(o.id)&&ev.length?'<div class="wrap rec-sum" style="margin-top:18px"><span class="chip'+(pa<live.length?' warn':' ok')+'">'+h(t('pfPermits',{a:pa,b:live.length}))+'</span>'+
      (dn.length?'<span class="chip'+(ra<dn.length?' warn':' ok')+'">'+h(t('pfReports',{a:ra,b:dn.length}))+'</span>':'')+(att?'<span class="chip ok">'+h(t('pfAtt',{n:att}))+'</span>':'')+'</div>':'')+
    (partners.length?'<section class="wrap block"><h2 class="sec-h">'+t('workedWith')+'</h2><div class="partners">'+partners.map(function(q){
        return '<a class="partner" href="#club-'+h(q.o.id)+'" data-club="'+h(q.o.id)+'" style="--c:'+q.o.color+'">'+logoPlate(q.o,'xs')+'<span dir="auto">'+h(q.o.name)+'</span><small>'+q.n+'</small></a>';}).join('')+'</div></section>':'')+
    (ev.length?
      '<section class="wrap block"><div class="block-head"><div><p class="eyebrow">'+t('navHome')+'</p><h2>'+t('pfUpTitle')+'</h2></div></div>'+
        (up.length?'<div class="grid tickets">'+up.map(function(e){return ticketHTML(e);}).join('')+'</div>':'<div class="empty">'+I.cal+'<p>'+t('pfNoUp')+'</p></div>')+'</section>'+
      (done.length?'<section class="wrap block"><div class="block-head"><div><p class="eyebrow">'+t('navPast')+'</p><h2>'+t('pfPastTitle')+'</h2><p>'+h(nEvents(done.length))+'</p></div></div><div class="grid pgrid">'+done.map(pcardHTML).join('')+'</div></section>':'')
      :'<section class="wrap block"><div class="empty">'+I.cal+'<p>'+t('pfNone')+'</p></div></section>');}
function term(ds){var p=ds.split('-').map(Number),y=p[0],m=p[1];
  if(m>=9)return {k:'fall',y1:y,y2:y+1,o:y*10+1};if(m===1)return {k:'fall',y1:y-1,y2:y,o:(y-1)*10+1};
  if(m<=5)return {k:'spring',y1:y-1,y2:y,o:(y-1)*10+2};return {k:'summer',y1:y-1,y2:y,o:(y-1)*10+3};}

function pastList(){
  var q=S.q.trim().toLowerCase(),ps=past();
  return ps.filter(function(e){return (S.fPast==='all'||hasOrg(e,S.fPast))&&(!q||evText(e).indexOf(q)>-1);});}
function pastResultsHTML(){
  var ps=past();if(!ps.length)return '<div class="empty" style="margin-top:24px">'+I.cam+'<p>'+t('pastNone')+'</p></div>';
  var list=pastList();if(!list.length)return '<div class="empty" style="margin-top:24px">'+I.search+'<p>'+t('pastEmpty')+'</p></div>';
  var groups={},order=[];list.forEach(function(e){var tm=term(e.date),k=tm.o;if(!groups[k]){groups[k]={tm:tm,items:[]};order.push(k);}groups[k].items.push(e);});
  order.sort(function(a,b){return b-a;});
  return order.map(function(k){var g=groups[k];return '<section class="term"><header class="term-head"><h2>'+t(g.tm.k)+'</h2><span class="yr">'+g.tm.y1+'/'+g.tm.y2+'</span><span class="cnt">'+nEvents(g.items.length)+'</span></header>'+
    '<div class="grid pgrid">'+g.items.map(pcardHTML).join('')+'</div></section>';}).join('');}

  var ps=past(),pc={};ps.forEach(function(e){orgsOf(e).forEach(function(o){pc[o.id]=o;});});var chips=Object.keys(pc).map(function(k){return pc[k];}).sort(byName);
  if(S.fPast!=='all'&&!pc[S.fPast])S.fPast='all';
  return '<section class="wrap page-head"><p class="eyebrow">'+t('navPast')+' · '+nEvents(ps.length)+'</p><h1>'+t('pastTitle')+'</h1><p>'+t('pastSub')+'</p>'+
    '<div class="toolbar"><label class="search"><span class="sr">'+t('searchLbl')+'</span>'+I.search+'<input id="q" type="search" value="'+h(S.q)+'" placeholder="'+h(t('search'))+'" autocomplete="off" dir="auto"></label>'+
    (chips.length>1?'<div class="filters" role="group" aria-label="'+h(t('lClub'))+'"><button class="fchip" type="button" data-fpast="all" aria-pressed="'+(S.fPast==='all')+'">'+t('allClubs')+'</button>'+
      chips.map(function(o){return '<button class="fchip" type="button" data-fpast="'+h(o.id)+'" aria-pressed="'+(S.fPast===o.id)+'" style="--c:'+o.color+'"><span class="dot"></span><span dir="auto">'+h(o.tag)+'</span></button>';}).join('')+'</div>':'')+

function fieldHTML(name,label,o){
  o=o||{};var v=S.draft[name]||'',err=S.errors[name],req=o.req!==false;
  var ctl=o.area?'<textarea id="f-'+name+'" name="'+name+'" dir="auto" placeholder="'+h(o.ph||'')+'"'+(err?' aria-invalid="true" aria-describedby="e-'+name+'"':'')+'>'+h(v)+'</textarea>'
    :'<input id="f-'+name+'" name="'+name+'" type="'+(o.type||'text')+'" value="'+h(v)+'"'+(o.type==='number'?' min="0" step="1" inputmode="numeric"':'')+(o.list?' list="'+o.list+'"':'')+(req?' required':'')+(o.type?'':' dir="auto"')+' placeholder="'+h(o.ph||'')+'" autocomplete="off"'+(err?' aria-invalid="true" aria-describedby="e-'+name+'"':'')+'>';
  return '<div class="field'+(err?' has-err':'')+'"><label for="f-'+name+'">'+label+(req?'':' <span class="opt">('+t('optional')+')</span>')+'</label>'+ctl+
    (o.hint?'<p class="hint">'+o.hint+'</p>':'')+(err?'<p class="err" id="e-'+name+'">'+err+'</p>':'')+'</div>';}
function dropHTML(name,label,o){
  var f=S.draft[name],err=S.errors[name],multi=name==='photos';
  var body;

    body=(f.length?'<div class="thumbs">'+f.map(function(p,i){return '<div class="thumb"><img src="'+p.url+'" alt=""><button type="button" data-rmphoto="'+i+'" aria-label="'+h(t('remove'))+'">'+I.x+'</button></div>';}).join('')+'</div>':'')+
      '<span class="di">'+I.cam+'</span><span class="dt">'+t('dropPhotos')+' <button type="button" class="linkbtn" data-pick="photos">'+t('choosePhotos')+'</button></span>';
  }else if(f){
    body='<div class="fchosen"><span class="fi">'+I.file+'</span><div><b dir="auto">'+h(f.name)+'</b><small>'+fSize(f.size)+'</small></div></div><button type="button" class="btn sm quiet" data-clear="'+name+'">'+t('remove')+'</button>';
  }else{

    '<div class="drop" data-drop="'+name+'" aria-labelledby="l-'+name+'">'+body+'<input type="file" id="f-'+name+'" data-file="'+name+'" accept="'+(multi?'image/jpeg,image/png,image/webp':'application/pdf,image/png,image/jpeg,image/webp')+'"'+(multi?' multiple':'')+' hidden></div>'+
    (o.hint?'<p class="hint">'+o.hint+'</p>':'')+(err?'<p class="err" id="e-'+name+'">'+err+'</p>':'')+'</div>';}

    return prepPhoto(f).then(function(pp){return upload(pp.blob,pp.type,f.name).then(function(r){ph.push({id:r.id,w:pp.w,h:pp.h});});});});});
  chain.then(function(){var next=clone(STATE);next.events.forEach(function(x){if(x.id===id)x.photos=x.photos.concat(ph);});return commit(next,{toast:'tPhotos',open:id});})
    .catch(function(e){busy(false);toast(errMsg(e));});}
function attachTo(id,kind,file){
  var ev=byId(id),bad=checkDoc(file);if(!ev)return;if(bad){toast(bad);return;}
  if(!caps.assets||!caps.db){toast(t('noDb'));return;}
  busy(true,t('uploading',{name:file.name,i:1,n:1}),.4);
  upload(file,typeOf(file),file.name).then(function(r){var rec={};rec[kind]={id:r.id,name:file.name,size:r.sizeBytes,type:r.contentType};return saveRecord(id,rec);})
    .then(function(){var next=clone(STATE);next.events.forEach(function(x){if(x.id===id){if(kind==='report')x.hasReport=true;else x.hasPermit=true;}});return commit(next,{toast:kind==='report'?'tReport':'tPermit',open:id});})
    .catch(function(e){busy(false);toast(errMsg(e));});}
function removePhoto(id,idx){var next=clone(STATE);next.events.forEach(function(x){if(x.id===id)x.photos.splice(idx,1);});commit(next,{toast:'tPhotoRemoved',open:id});}
function deleteEvent(id){var next=clone(STATE);next.events=next.events.filter(function(x){return x.id!==id;});commit(next,{toast:'tDeleted'});}
function removeSamples(){var next=clone(STATE);next.events=next.events.filter(function(x){return !x.sample;});commit(next,{toast:'tSamples'});}

function takeFiles(name,list){
  var files=Array.prototype.slice.call(list||[]);if(!files.length)return;
  if(name==='photos'){var bad=[];files.forEach(function(f){var ty=typeOf(f);if(PHOTO_TYPES.indexOf(ty)<0)bad.push(t('badPhoto',{name:f.name}));else if(f.size>MAXB*2)bad.push(t('tooBig',{name:f.name}));else S.draft.photos.push({file:f,url:URL.createObjectURL(f)});});
    if(bad.length)S.errors.photos=bad.join(' ');else delete S.errors.photos;}
  else{var f=files[0],b=checkDoc(f);if(b){S.errors[name]=b;}else{S.draft[name]=f;delete S.errors[name];}}
  renderMain();}

/* ---------- events ---------- */
document.addEventListener('click',function(e){

  if(el.hasAttribute('data-rv')){var rv=el.getAttribute('data-rv'),rid=el.getAttribute('data-id');
