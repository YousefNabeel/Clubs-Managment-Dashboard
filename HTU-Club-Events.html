  if(el.hasAttribute('data-club')){e.preventDefault();go('club',el.getAttribute('data-club'));return;}
  if(el.hasAttribute('data-ctab')&&!el.hasAttribute('data-go')){CT.tab=el.getAttribute('data-ctab');var yy=window.scrollY;renderMain();window.scrollTo(0,yy);var tb=document.querySelector('[data-ctab="'+CT.tab+'"]');if(tb)tb.focus();return;}
  if(el.hasAttribute('data-close-imp')){closeImport();return;}
  if(el.hasAttribute('data-sort')){var sk=el.getAttribute('data-sort');if(R.sort===sk)R.dir=-R.dir;else{R.sort=sk;R.dir=1;}refreshRecords();var fb=document.querySelector('[data-sort="'+sk+'"]');if(fb)fb.focus();return;}
  if(el.id==='theme-btn'){var bx=el.getBoundingClientRect();setTheme(isDark()?'light':'dark',bx.left+bx.width/2,bx.top+bx.height/2);return;}
  if(el.id==='lang-btn'){lang=lang==='ar'?'en':'ar';store.set('hce-lang',lang);renderAll();return;}
  if(el.hasAttribute('data-go')){e.preventDefault();
    if(el.id==='brand'){var n=performance.now();eggN=n-eggT<1600?eggN+1:1;eggT=n;if(eggN>=5){eggN=0;confetti();}}
    var v=el.getAttribute('data-go');if(v==='clubs')CT.tab=el.getAttribute('data-ctab')||'clubs';if(v==='add'&&S.editing&&el.hasAttribute('data-fresh')&&S.view!=='add')resetDraft();if(v==='add'&&S.view!=='add')S.addFrom=S.view;go(v);return;}
  if(el.hasAttribute('data-open')){e.preventDefault();openEvent(el.getAttribute('data-open'));return;}
  if(el.hasAttribute('data-close')){closeSheet();return;}
  if(el.hasAttribute('data-fup')){S.fUp=el.getAttribute('data-fup');var m=document.getElementById('main'),y=window.scrollY;renderMain();window.scrollTo(0,y);return;}
  if(el.hasAttribute('data-fpast')){S.fPast=el.getAttribute('data-fpast');document.querySelectorAll('[data-fpast]').forEach(function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-fpast')===S.fPast));});
    var pr=document.getElementById('past-results');if(pr){pr.innerHTML=pastResultsHTML();afterRender(pr);}return;}
  if(el.hasAttribute('data-pick')){var inp=document.getElementById('f-'+el.getAttribute('data-pick'));if(inp)inp.click();return;}
  if(el.hasAttribute('data-clear')){S.draft[el.getAttribute('data-clear')]=null;renderMain();return;}
  if(el.hasAttribute('data-rmphoto')){var ix=+el.getAttribute('data-rmphoto'),p=S.draft.photos[ix];if(p)try{URL.revokeObjectURL(p.url);}catch(x){}S.draft.photos.splice(ix,1);renderMain();return;}
  if(el.hasAttribute('data-lb')){S.lb={id:S.openId,i:+el.getAttribute('data-lb')};renderLB();return;}
  if(el.hasAttribute('data-lbclose')){closeLB();return;}
  if(el.hasAttribute('data-lbstep')){var ev=byId(S.lb.id),n=ev.photos.length;S.lb.i=(S.lb.i+(+el.getAttribute('data-lbstep'))+n)%n;renderLB();return;}
  if(el.hasAttribute('data-rmp')){
    if(!el.classList.contains('armed')){document.querySelectorAll('.rm.armed').forEach(function(b){b.classList.remove('armed');b.querySelector('span').textContent=t('removePhoto');});
      el.classList.add('armed');el.querySelector('span').textContent=t('confirmRemove');setTimeout(function(){if(el.isConnected&&el.classList.contains('armed')){el.classList.remove('armed');el.querySelector('span').textContent=t('removePhoto');}},3500);return;}
    removePhoto(S.openId,+el.getAttribute('data-rmp'));return;}
  if(el.hasAttribute('data-attach')){var fi=document.getElementById('sheet-file');if(!fi)return;fi.accept='application/pdf,image/png,image/jpeg,image/webp';fi.multiple=false;fi.setAttribute('data-kind',el.getAttribute('data-attach'));fi.value='';fi.click();return;}
  var a=el.getAttribute('data-act');
  if(a==='edit-id'){S.openId=el.getAttribute('data-id');a='edit';}
  if(a==='export-mine'){var mo=orgById(clubRole());exportExcel(STATE.events.filter(function(x){return hasOrg(x,clubRole());}),'HTU-'+(mo?mo.tag.replace(/[^A-Za-z0-9]+/g,'-'):'club')+'-events');return;}
  if(a==='to-up'){e.preventDefault();var u=document.getElementById('upcoming');if(u)u.scrollIntoView({behavior:RM.matches?'auto':'smooth',block:'start'});return;}
  if(a==='rm-samples'){removeSamples();return;}
  if(a==='export'){exportExcel();return;}
  if(a==='add-club'){var ao=orgById(el.getAttribute('data-cid'));resetDraft();if(ao)S.draft.club=ao.name;S.addFrom='club';go('add');return;}
  if(a==='import'){var fi2=document.getElementById('imp-file');if(fi2){fi2.value='';fi2.click();}return;}
  if(a==='imp-go'){importCommit();return;}
  if(a==='del'){S.confirmDel=true;renderSheet();return;}
  if(a==='del-no'){S.confirmDel=false;renderSheet();return;}
  if(a==='del-yes'){deleteEvent(S.openId);return;}
  if(a==='add-photos'){var sf=document.getElementById('sheet-file');if(!sf)return;sf.accept='image/jpeg,image/png,image/webp';sf.multiple=true;sf.setAttribute('data-kind','photos');sf.value='';sf.click();return;}
  if(a==='edit'){var ev2=byId(S.openId);if(!ev2)return;resetDraft();S.addFrom=S.view;S.editing=ev2.id;['club','activity','place','date','time','about','kind','end','status','timeEnd'].forEach(function(k){S.draft[k]=ev2[k]||'';});var eo=orgsOf(ev2);if(eo.length>1){S.draft.club=eo[0].name;S.draft.partner=eo.slice(1).map(function(o){return o.name;}).join(' + ');}S.draft.att=ev2.att!=null?String(ev2.att):'';
    if(caps.db)caps.db.doc('records/'+ev2.id).get().then(function(sn){var nt=sn.exists?((sn.data()||{}).notes||''):'';if(S.editing!==ev2.id||S.draft.notes)return;S.draft.notes=nt;S.draft.notesOrig=nt;var fn=document.getElementById('f-notes');if(fn)fn.value=nt;}).catch(function(){});closeSheet(true);go('add');return;}
  if(a==='cancel-edit'){var back=S.editing;resetDraft();S.view=S.addFrom&&S.addFrom!=='add'?S.addFrom:'home';setHash(viewHash());renderMain();if(back)openEvent(back);return;}
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='demo-club'){setRole('club',el.value);return;}
  if(el.id==='imp-file'){var ff=el.files&&el.files[0];if(ff)importFile(ff);return;}
  if(el.id==='sheet-file'){var k=el.getAttribute('data-kind'),fs=Array.prototype.slice.call(el.files||[]);if(!fs.length||!S.openId)return;
    if(k==='photos')addPhotosTo(S.openId,fs);else attachTo(S.openId,k,fs[0]);return;}
  if(el.hasAttribute('data-file'))takeFiles(el.getAttribute('data-file'),el.files);
  if(el.id==='r-club'){R.club=el.value;refreshRecords();}else if(el.id==='r-st'){R.st=el.value;refreshRecords();}else if(el.id==='r-yr'){R.yr=el.value;refreshRecords();}
});
var qTimer=0;
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.id==='rq'){R.q=el.value;clearTimeout(qTimer);qTimer=setTimeout(refreshRecords,140);return;}
  if(el.id==='q'){S.q=el.value;clearTimeout(qTimer);qTimer=setTimeout(function(){var pr=document.getElementById('past-results');if(pr){pr.innerHTML=pastResultsHTML();afterRender(pr);}},140);return;}
  if(el.form&&el.form.id==='ev-form'&&el.name){S.draft[el.name]=el.value;if(S.errors[el.name]&&el.value.trim()){delete S.errors[el.name];var fld=el.closest('.field');if(fld){fld.classList.remove('has-err');var er=fld.querySelector('.err');if(er)er.remove();el.removeAttribute('aria-invalid');}}
    stashDraft();var pv=document.getElementById('pv');if(pv)pv.innerHTML=previewHTML();}
});
var sw=null,swipedAt=0;
document.addEventListener('pointerdown',function(e){var z=e.target.closest&&e.target.closest('#nu-slides');sw=z?{x:e.clientX,y:e.clientY}:null;},{passive:true});
document.addEventListener('pointerup',function(e){if(!sw)return;var dx=e.clientX-sw.x,dy=e.clientY-sw.y;sw=null;
  if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3){var st=(dx<0?1:-1)*(lang==='ar'?-1:1);swipedAt=Date.now();showSlide(S.slide+st,st);}});
document.addEventListener('animationend',function(e){if(e.animationName!=='dotfill'||RM.matches)return;var d=e.target.closest&&e.target.closest('.nu-dot');if(d&&d.classList.contains('on'))showSlide(S.slide+1,1);});
document.addEventListener('visibilitychange',syncAuto);
document.addEventListener('mouseout',function(e){var dd=e.target.closest&&e.target.closest('#nav-dd');if(dd&&!dd.contains(e.relatedTarget))dd.classList.remove('shut');});
document.addEventListener('submit',function(e){if(e.target.id==='ev-form'){e.preventDefault();submitForm();}});
['dragover','dragenter'].forEach(function(n){document.addEventListener(n,function(e){var z=e.target.closest&&e.target.closest('[data-drop]');if(!z)return;e.preventDefault();z.classList.add('over');});});
document.addEventListener('dragleave',function(e){var z=e.target.closest&&e.target.closest('[data-drop]');if(z&&!z.contains(e.relatedTarget))z.classList.remove('over');});
document.addEventListener('drop',function(e){var z=e.target.closest&&e.target.closest('[data-drop]');if(!z)return;e.preventDefault();z.classList.remove('over');takeFiles(z.getAttribute('data-drop'),e.dataTransfer&&e.dataTransfer.files);});
document.addEventListener('keydown',function(e){
  if(S.imp&&e.key==='Escape'){closeImport();return;}
  if(S.lb){if(e.key==='Escape'){closeLB();return;}var ev=byId(S.lb.id);if(!ev)return;var n=ev.photos.length,fwd=lang==='ar'?'ArrowLeft':'ArrowRight',bwd=lang==='ar'?'ArrowRight':'ArrowLeft';
    if(e.key===fwd){S.lb.i=(S.lb.i+1)%n;renderLB();}else if(e.key===bwd){S.lb.i=(S.lb.i-1+n)%n;renderLB();}return;}
  if(!S.openId&&document.activeElement&&document.activeElement.closest&&document.activeElement.closest('.nu-wrap')&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){var fw=lang==='ar'?'ArrowLeft':'ArrowRight',st2=e.key===fw?1:-1;e.preventDefault();showSlide(S.slide+st2,st2);return;}
  if(!S.openId&&(e.key==='Enter'||e.key===' ')&&e.target&&e.target.matches&&e.target.matches('tr[data-open]')){e.preventDefault();openEvent(e.target.getAttribute('data-open'));return;}
  if(S.openId){if(e.key==='Escape'){closeSheet();return;}
    if(e.key==='Tab'){var sh=document.querySelector('.sheet');if(!sh)return;var f=sh.querySelectorAll('button,a[href],input:not([hidden]),[tabindex]:not([tabindex="-1"])');if(!f.length)return;var first=f[0],last=f[f.length-1];
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}}
});

/* ---------- boot ---------- */
var flash=null;try{flash=JSON.parse(sess.get('hce-flash')||'null');}catch(e){}sess.del('hce-flash');
if(flash&&flash.clearDraft)resetDraft();
routeFromHash(true);
if(flash&&flash.open&&byId(flash.open)){var fe=byId(flash.open);S.view=flash.view==='records'?'records':isUp(fe)?'home':'past';S.openId=flash.open;}
else if(flash&&flash.view)S.view=flash.view;
function idbOpen(){return new Promise(function(res,rej){try{var r=indexedDB.open('hce-files',1);r.onupgradeneeded=function(){r.result.createObjectStore('f');};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};}catch(e){rej(e);}});}
function idbAll(d){return new Promise(function(res,rej){var out={},cur=d.transaction('f','readonly').objectStore('f').openCursor();cur.onsuccess=function(){var c=cur.result;if(c){out[c.key]=c.value;c.continue();}else res(out);};cur.onerror=function(){rej(cur.error);};});}
function idbPut(d,k,v){return new Promise(function(res,rej){var tx=d.transaction('f','readwrite');tx.objectStore('f').put(v,k);tx.oncomplete=function(){res();};tx.onerror=function(){rej(tx.error);};});}
function lsRec(){try{return JSON.parse(localStorage.getItem(LS_REC)||'{}')||{};}catch(e){return {};}}
function localCaps(){
  caps.local=true;caps.ready=true;caps.canEdit=!!LOCAL_EDIT&&ROLE.kind!=='student';
  if(!LOCAL_EDIT)return;
  caps.artifact={publish:function(){return Promise.reject({code:'not_granted'});}};
  caps.assets={upload:function(b,o){var id='l'+Date.now().toString(36)+Math.random().toString(36).slice(2,8),ty=(o&&o.type)||b.type||'application/octet-stream';
    LOCAL_URLS[id]=URL.createObjectURL(b);
    var p=idb?idbPut(idb,id,{blob:b,type:ty}).catch(function(){S.idbWarn=true;}):Promise.resolve(S.idbWarn=true);
    return p.then(function(){return {id:id,url:LOCAL_URLS[id],sizeBytes:b.size,contentType:ty};});}};
  caps.db={collection:function(name){return {get:function(){var all=lsRec(),pre=name+'/';return Promise.resolve({docs:Object.keys(all).filter(function(k){return k.indexOf(pre)===0;}).map(function(k){return {id:k.slice(pre.length),exists:true,data:function(){return all[k];}};})});}};},
  doc:function(path){return {
    get:function(){var d=lsRec()[path];return Promise.resolve({exists:!!d,data:function(){return d;}});},
    set:function(data){var all=lsRec();all[path]=data;try{localStorage.setItem(LS_REC,JSON.stringify(all));}catch(e){return Promise.reject({code:'quota_exceeded'});}return Promise.resolve();}};}};
  caps.downloads={save:function(o){var u=URL.createObjectURL(o.data instanceof Blob?o.data:new Blob([o.data]));var a=document.createElement('a');a.href=u;a.download=o.filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(u);},5000);return Promise.resolve({status:'saved'});}};}
function startUI(){
  renderAll();
  if(flash&&flash.toast)setTimeout(function(){toast(t(flash.toast));},250);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(placeInk);}
function use(n){try{return window.claude&&window.claude.use?window.claude.use(n).catch(function(){return null;}):Promise.resolve(null);}catch(e){return Promise.resolve(null);}}

if(LOCAL){
  localCaps();
  var started=false,once=function(){if(!started){started=true;startUI();}};
  setTimeout(once,700);
  (LOCAL_EDIT?idbOpen():Promise.reject()).then(function(d){idb=d;return idbAll(d);}).then(function(all){Object.keys(all).forEach(function(k){if(all[k]&&all[k].blob)LOCAL_URLS[k]=URL.createObjectURL(all[k].blob);});})
    .catch(function(){}).then(function(){if(started)renderAll();else once();});
}else{
  startUI();
  use('assets').then(function(v){caps.assets=v;});
  use('db').then(function(v){caps.db=v;});
  use('downloads').then(function(v){caps.downloads=v;});
  Promise.all([use('artifact'),use('user')]).then(function(r){
    caps.artifact=r[0];caps.user=r[1];
    if(!caps.artifact)return false;
    if(!caps.user)return use('assets').then(function(a){return !!a;});
    return Promise.all([caps.user.isOwner(),caps.user.canEdit()]).then(function(v){return !!(v[0]||v[1]);},function(){return false;});
  }).then(function(ok){caps.canEdit=!!ok;},function(){caps.canEdit=false;}).then(function(){
    caps.ready=true;
    var hadForm=S.view==='add'||S.view==='records';
    var recLink=document.querySelector('[data-nav="records"]');if(recLink)recLink.hidden=!caps.canEdit;
    if(caps.canEdit){renderAll();}else{if(hadForm)renderMain();placeInk();}
  });
}
})();
